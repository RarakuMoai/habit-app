# ARB → AppLocalizations 的產生設定。
#
# 主要語言是繁中：所有文案先在 app_zh.arb 定稿，其他語言再跟上。
# `zh` 直接就是繁體（主要市場台灣），未來加簡中用 app_zh_Hans.arb 區分——
# Flutter 要求有 script/country code 的 locale 必須有無後綴的 base 當 fallback。
# 執行 `flutter gen-l10n`（或任何 flutter build/run）會自動重新產生。
#
# 遷移原則見 docs/i18n_migration.md：
# - 新字串一律直接寫進 ARB，不要再硬編碼。
# - 舊字串照「順路遷移」——改到那一頁的行為時，順手把該頁抽掉。
# - 兔咪台詞等文本**穩定後**才整批遷移，否則等於每句話改兩次。

arb-dir: lib/l10n
template-arb-file: app_zh.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# 繁中是模板語言；其他語言缺字串時回退到它，不會顯示空白。
untranslated-messages-file: lib/l10n/untranslated.json
nullable-getter: false
