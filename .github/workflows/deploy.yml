name: Deploy Flutter Web to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tumi-web-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/codex/beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: 安裝相依套件
        run: flutter pub get

      - name: 編譯 Web 測試版
        run: flutter build web --release --base-href "/habit-app/"

      - name: 記錄來源版本
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          version = next(line.split(':', 1)[1].strip() for line in pathlib.Path('pubspec.yaml').read_text().splitlines() if line.startswith('version:'))
          pathlib.Path('build/web/version.json').write_text(json.dumps({
              'name': '兔咪測試版',
              'version': version,
              'commit': os.environ['SOURCE_COMMIT'],
              'branch': os.environ['SOURCE_BRANCH'],
          }, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
