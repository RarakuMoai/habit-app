<style>
:root{color-scheme:light;--paper:#fff8ee;--ink:#604334;--muted:#806e61;--accent:#ab674c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,sans-serif}

<section id="details"><h2>相遇之後，走進日常</h2><p>所有功能入口先開放，習慣由自己加入。開發者預覽可試改名稱，離開後不改存檔。</p><div class="grid"><figure><a href="04b-name-keyboard.png" target="_blank"><img loading="lazy" src="04b-name-keyboard.png" alt="命名輸入中（模擬器未顯示軟體鍵盤）"></a><figcaption>命名輸入中（模擬器未顯示軟體鍵盤）</figcaption></figure><figure><a href="07-home.png" target="_blank"><img loading="lazy" src="07-home.png" alt="安靜回到首頁"></a><figcaption>安靜回到首頁</figcaption></figure><figure><a href="08-timers.png" target="_blank"><img loading="lazy" src="08-timers.png" alt="計時入口"></a><figcaption>計時入口</figcaption></figure><figure><a href="09-water.png" target="_blank"><img loading="lazy" src="09-water.png" alt="喝水入口"></a><figcaption>喝水入口</figcaption></figure><figure><a href="10-weight.png" target="_blank"><img loading="lazy" src="10-weight.png" alt="體重空狀態"></a><figcaption>體重空狀態</figcaption></figure><figure><a href="11-family.png" target="_blank"><img loading="lazy" src="11-family.png" alt="家庭空狀態"></a><figcaption>家庭空狀態</figcaption></figure><figure><a href="12-wardrobe.png" target="_blank"><img loading="lazy" src="12-wardrobe.png" alt="衣櫃與回憶"></a><figcaption>衣櫃與回憶</figcaption></figure><figure><a href="13-developer-preview-entry.png" target="_blank"><img loading="lazy" src="13-developer-preview-entry.png" alt="開發者預覽入口"></a><figcaption>開發者預覽入口</figcaption></figure><figure><a href="14-preview-arrival.png" target="_blank"><img loading="lazy" src="14-preview-arrival.png" alt="重看開場"></a><figcaption>重看開場</figcaption></figure><figure><a href="15-preview-ending.png" target="_blank"><img loading="lazy" src="15-preview-ending.png" alt="只保留在預覽裡的稱呼草稿"></a><figcaption>只保留在預覽裡的稱呼草稿</figcaption></figure></div></section>
<section id="comparison"><h2>與 V2 的開場比較</h2><p>保留舊版原生畫面供比較：由功能問答改為初次相遇。</p><div class="grid"><figure><a href="../review_v2/onboarding/onboarding-01-welcome.webp" target="_blank"><img loading="lazy" src="../review_v2/onboarding/onboarding-01-welcome.webp" alt="V2 開場"></a><figcaption>V2 開場</figcaption></figure><figure><a href="01-arrival.png" target="_blank"><img loading="lazy" src="01-arrival.png" alt="故事前導：先走進家"></a><figcaption>故事前導：先走進家</figcaption></figure><figure><a href="../review_v2/onboarding/onboarding-02-name.webp" target="_blank"><img loading="lazy" src="../review_v2/onboarding/onboarding-02-name.webp" alt="V2 命名"></a><figcaption>V2 命名</figcaption></figure><figure><a href="04-a-name.png" target="_blank"><img loading="lazy" src="04-a-name.png" alt="故事前導：自然留下稱呼"></a><figcaption>故事前導：自然留下稱呼</figcaption></figure></div></section>

<script>const scenes=[["01-arrival.png", "走進這個家", "先停在房間裡，讓一段新的日常慢慢開始。"], ["02-hello.png", "初次見面", "兔咪練習過招呼，真正見面時還是有一點緊張。"], ["03-a-new-routine.png", "他想改變的事", "學著照顧生活，也試著主動與人說話。"], ["04-a-name.png", "你想怎麼叫他", "本名是兔咪，也可以留下自己的暱稱。"], ["05-your-name.png", "留下你的稱呼", "可以現在說，也可以之後再說。"], ["06-a-beginning.png", "從這次相遇開始", "相識之後，才一起走進日常。"]];let index=0;const dots=document.querySelector('#dots');scenes.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',`第 ${i+1} 幕`);b.onclick=()=>show(i,true);dots.append(b)});
function show(i,scroll=false){index=Math.max(0,Math.min(scenes.length-1,i));const [file,title,description]=scenes[index];const img=document.querySelector('#scene');img.src=file;img.alt=title;document.querySelector('#full').href=file;document.querySelector('#count').textContent=`${String(index+1).padStart(2,'0')} / 06`;document.querySelector('#heading').textContent=title;document.querySelector('#description').textContent=description;document.querySelector('#previous').disabled=index===0;document.querySelector('#next').disabled=index===scenes.length-1;[...dots.children].forEach((d,n)=>{d.classList.toggle('active',n===index);d.setAttribute('aria-current',n===index?'step':'false')});if(scroll)document.querySelector('#reading').scrollIntoView({block:'start',behavior:'instant'})}document.querySelector('#previous').onclick=()=>show(index-1,true);document.querySelector('#next').onclick=()=>show(index+1,true);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)});show(0);</script></html>
