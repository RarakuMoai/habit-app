# Static analysis configuration. Baseline is flutter_lints, tightened with
# strict language modes and additional rules below.
# Docs: https://dart.dev/guides/language/analysis-options
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Async correctness
    - avoid_void_async
    - cancel_subscriptions
    - unawaited_futures
    - unnecessary_await_in_return

    # API hygiene
    - always_declare_return_types
    - avoid_redundant_argument_values
    - use_named_constants

    # Style / consistency
    - avoid_bool_literals_in_conditional_expressions
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_breaks
    - unnecessary_lambdas
    - unnecessary_parenthesis

    # Flutter widgets
    - use_colored_box
    - use_decorated_box
